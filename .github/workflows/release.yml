name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - uses: kunobi-ninja/kache-action@v1
        with:
          fetch-depth: 0
      - name: Checkout starling core
        run: git clone https://forgejo.hearthhome.lol/Saltfault/Starling.git starling
      - name: Point patch to local starling
        run: sed -i.bak 's|starling = { git = .*|starling = { path = "./starling" }|' Cargo.toml && rm -f Cargo.toml.bak
      - name: Extract version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Check version increased
        id: check
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          current="v${{ steps.version.outputs.value }}"
          if [ -z "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" = "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features

  build:
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: i686-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout starling core
        run: git clone https://forgejo.hearthhome.lol/Saltfault/Starling.git starling
      - name: Point patch to local starling
        if: runner.os != 'Windows'
        run: sed -i.bak 's|starling = { git = .*|starling = { path = "./starling" }|' Cargo.toml && rm -f Cargo.toml.bak
      - name: Point patch to local starling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c = Get-Content Cargo.toml -Raw
          $c = $c -replace 'starling = \{ git = [^}]+\}', 'starling = { path = "./starling" }'
          [IO.File]::WriteAllText("$pwd\Cargo.toml", $c)
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --no-default-features
      - name: Prepare binary
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *-windows-* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/starling-server$ext" "starling-server-${{ matrix.target }}$ext"
          sha256sum "starling-server-${{ matrix.target }}$ext" > "starling-server-${{ matrix.target }}.sha256"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: starling-server-${{ matrix.target }}
          path: starling-server-${{ matrix.target }}*
      - name: Upload install scripts
        uses: actions/upload-artifact@v7
        with:
          name: install-scripts
          path: |
            install.sh
            install.ps1

  release:
    needs: [detect, build]
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          files: artifacts/**/*
          body: |
            ## Quick install

            **Windows (PowerShell):**
            ```
            irm https://forgejo.hearthhome.lol/Saltfault/Starling-Server/releases/download/v${{ needs.detect.outputs.version }}/install.ps1 | iex
            ```

            **Linux / macOS:**
            ```
            curl -sSfL https://forgejo.hearthhome.lol/Saltfault/Starling-Server/releases/download/v${{ needs.detect.outputs.version }}/install.sh | bash
            ```

            ## Manual download

            | Platform | Binary |
            |----------|--------|
            | Windows (64-bit) | `starling-server-x86_64-pc-windows-msvc.exe` |
            | Windows (32-bit) | `starling-server-i686-pc-windows-msvc.exe` |
            | macOS (M1–M4) | `starling-server-aarch64-apple-darwin` |
            | macOS (Intel) | `starling-server-x86_64-apple-darwin` |
            | Linux (x64) | `starling-server-x86_64-unknown-linux-gnu` |
            | Linux (musl) | `starling-server-x86_64-unknown-linux-musl` |
            | Linux (ARM64) | `starling-server-aarch64-unknown-linux-gnu` |
            | Linux (ARMv7) | `starling-server-armv7-unknown-linux-gnueabihf` |
            | Linux (32-bit) | `starling-server-i686-unknown-linux-gnu` |
