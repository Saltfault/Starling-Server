[package]
name = "Starling-Server"
version = "0.4.6"
edition = "2024"
license = "Apache-2.0"
description = "Headless roost server for Starling — persistent chat history and message relay"

[lib]
name = "starling_server"

[[bin]]
name = "starling-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
fs2 = "0.4"
lru = "0.12"
iroh = "1.0.3"
iroh-gossip = "0.101.0"
n0-future = "0.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
sled = "0.34"
starling = { git = "https://forgejo.hearthhome.lol/Saltfault/Starling.git", tag = "v0.5.4" }
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
